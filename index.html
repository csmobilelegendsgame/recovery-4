<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapan permasalahan akun terjadi?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #F7F9FA; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; user-select: none; overflow: hidden; }
        
        /* Header */
        .header { background: #3B66A4; color: white; text-align: center; padding: 15px; font-size: 14px; position: relative; z-index: 10; }
        .btn-back-top { position: absolute; left: 15px; color: white; text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Content Form */
        .content { flex: 1; padding: 20px 16px; z-index: 10; }
        
        /* Kotak Kalender Bawaan HP */
        .date-input-container { background: white; border: 1px solid #EAEAEA; border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; position: relative; }
        
        /* Sembunyikan visual bawaan input date tapi buat areanya memenuhi kotak */
        .native-date-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
        
        /* Teks Display untuk mencerminkan tanggal */
        .date-display { font-size: 16px; color: #333; }
        .calendar-icon { width: 20px; height: 20px; color: #999; pointer-events: none; }
        
        /* Teks Deskripsi */
        .desc-text { font-size: 13px; color: #666; text-align: center; line-height: 1.5; padding: 0 10px; }
        
        /* Footer Buttons */
        .footer { padding: 16px; z-index: 10; background: #F7F9FA; }
        .btn-container { display: flex; gap: 12px; margin-bottom: 15px; }
        
        /* Base Button Style */
        .btn { flex: 1; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        
        /* Tombol Kembali (Putih) */
        .btn-white { background: white; color: #555; border: 1px solid #EAEAEA; }
        .btn-white:active { background: #F0F2F3; }
        
        /* Tombol Berikutnya (Biru) */
        .btn-blue { background: #1A8CFF; color: white; }
        .btn-blue:active { background: #0073E6; }
        
        .wm { text-align: center; font-size: 10px; color: #AAA; }
    </style>
</head>
<body>

    <div class="header">
        <span class="btn-back-top" onclick="kembaliLink()">&#10094;</span>
        Kapan permasalahan akun terjadi?
    </div>

    <div class="content">
        <div class="date-input-container">
            <!-- Teks yang menampilkan tanggal terpilih -->
            <span class="date-display" id="dateText">0000-00-00</span>
            
            <svg class="calendar-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>

            <!-- Input Date Asli Bawaan HP (Dibuat transparan menutupi seluruh kotak) -->
            <input type="date" id="nativePicker" class="native-date-input" onchange="handleDateChange(this)">
        </div>

        <div class="desc-text">
            Mohon mengisi dengan keterangan waktu yang sama persis ketika masalah terjadi, karena ini dapat mempengaruhi efisiensi dan hasil dari Customer Service
        </div>
    </div>

    <div class="footer">
        <div class="btn-container">
            <button type="button" class="btn btn-white" onclick="kembaliLink()">Kembali</button>
            <a href="https://csmobilelegendsgame.github.io/recovery-5/" class="btn btn-blue">Berikutnya</a>
        </div>
        <div class="wm">Powered by AIHELP.NET</div>
    </div>

    <script>
        const dateText = document.getElementById('dateText');
        const nativePicker = document.getElementById('nativePicker');

        // Fungsi inisialisasi default tanggal real-time WIB (Asia/Jakarta)
        function initRealTimeWIB() {
            const sekarang = new Date();
            
            // Format paksa ke zona WIB dengan bentuk standar YYYY-MM-DD
            const opsiWib = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
            const wibString = sekarang.toLocaleDateString('en-CA', opsiWib); 
            
            // Set nilai awal ke input bawaan HP dan teks tampilan luar
            nativePicker.value = wibString;
            dateText.innerText = wibString;
        }

        // Fungsi yang berjalan otomatis ketika user memilih tanggal baru dari kalender HP
        function handleDateChange(input) {
            if (input.value) {
                dateText.innerText = input.value;
            }
        }

        // Jalankan setelan waktu saat dokumen siap
        initRealTimeWIB();

        function kembaliLink() {
            window.location.replace("https://csmobilelegendsgame.github.io/recovery-3/");
        }
    </script>

</body>
</html>
