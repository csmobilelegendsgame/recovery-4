<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapan permasalahan akun terjadi?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #F7F9FA; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; user-select: none; }
        
        /* Header */
        .header { background: #3B66A4; color: white; text-align: center; padding: 15px; font-size: 14px; position: relative; }
        .btn-back-top { position: absolute; left: 15px; color: white; text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Content Form */
        .content { flex: 1; padding: 20px 16px; }
        
        /* Input Tanggal Wrapper */
        .date-input-container { position: relative; background: white; border: 1px solid #EAEAEA; border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        
        /* Input Native Date */
        .date-field { width: 100%; border: none; outline: none; font-size: 16px; color: #333; background: transparent; -webkit-appearance: none; appearance: none; }
        
        /* Teks Deskripsi di Bawah Input */
        .desc-text { font-size: 13px; color: #666; text-align: center; line-height: 1.5; padding: 0 10px; }
        
        /* Footer Buttons */
        .footer { padding: 16px; }
        .btn-container { display: flex; gap: 12px; margin-bottom: 15px; }
        .btn { flex: 1; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; }
        
        /* Tombol Kembali (Putih) */
        .btn-white { background: white; color: #555; border: 1px solid #EAEAEA; }
        .btn-white:active { background: #F0F2F3; }
        
        /* Tombol Berikutnya (Biru) */
        .btn-blue { background: #1A8CFF; color: white; }
        .btn-blue:active { background: #0073E6; }
        
        .wm { text-align: center; font-size: 10px; color: #AAA; }
    </style>
</head>
<body>

    <div class="header">
        <span class="btn-back-top" onclick="kembaliLink()">&#10094;</span>
        Kapan permasalahan akun terjadi?
    </div>

    <div class="content">
        <div class="date-input-container">
            <input type="date" class="date-field" id="dateInput" value="2026-04-10">
        </div>

        <div class="desc-text">
            Mohon mengisi dengan keterangan waktu yang sama persis ketika masalah terjadi, karena ini dapat mempengaruhi efisiensi dan hasil dari Customer Service
        </div>
    </div>

    <div class="footer">
        <div class="btn-container">
            <button class="btn btn-white" onclick="kembaliLink()">Kembali</button>
            <button class="btn btn-blue" onclick="arahkanLink()">Berikutnya</button>
        </div>
        <div class="wm">Powered by AIHELP.NET</div>
    </div>

    <script>
        // Otomatis set input tanggal ke hari ini jika ingin default, 
        // tapi di atas sudah diset contoh static "2026-04-10" sesuai gambar.

        // EDIT LINK UNTUK TOMBOL KEMBALI DI SINI
        function kembaliLink() {
            window.location.href = "https://LINK-KEMBALI-KAMU.com";
        }

        // EDIT LINK UNTUK TOMBOL BERIKUTNYA DI SINI
        function arahanLink() {
            window.location.href = "https://LINK-BERIKUTNYA-KAMU.com";
        }
    </script>

</body>
</html>
